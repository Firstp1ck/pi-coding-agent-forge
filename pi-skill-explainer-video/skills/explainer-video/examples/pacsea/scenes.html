<!--
  Recreated Pacsea main screen (v0.8.x layout) using Pacsea's default theme colours

  One template serves every step; each step's "setup" puts it in the right state.
-->
<style>
.pc { position: absolute; inset: 0; background: #1e1e2e; color: #cdd6f4; font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 20px; line-height: 30px; }

.pc .dim { color: #7f849c; }

.pc .sky { color: #74c7ec; }
.pc-top { position: absolute; left: 0; right: 0; top: 0; height: 44px; padding: 7px 14px; display: flex; gap: 12px; align-items: center; }
.pc-top .tag { color: #1e1e2e; background: #a6e3a1; padding: 0 4px; }
.pc-top .menu { color: #1e1e2e; background: #b4befe; padding: 0 4px; }
.pc-top .spacer { flex: 1; }
.pc-updates { color: #1e1e2e; background: #cba6f7; padding: 0 8px; position: absolute; left: 50%; transform: translateX(-50%); top: 7px; }
.pc-box { position: absolute; border: 1px solid #45475a; }
.pc-box > .title { position: absolute; top: -16px; left: 10px; background: #1e1e2e; padding: 0 4px; color: #a6adc8; }
.pc-box.focus { border-color: #cba6f7; }
.pc-box.focus > .title { color: #cba6f7; }
.pc-results { left: 6px; right: 6px; top: 52px; height: 392px; padding: 6px 0; }
.pc-list { position: absolute; left: 0; right: 0; top: 6px; }
.pc-row { padding: 0 12px; white-space: nowrap; }
.pc-row.sel { background: #313244; }
.pc-row.sel::before { content: '> '; color: #cba6f7; }
.pc-row:not(.sel)::before { content: '  '; }
.pc-row .repo { color: #74c7ec; }
.pc-row .repo.aur { color: #cba6f7; }
.pc-row .name { color: #cdd6f4; font-weight: 700; margin: 0 10px 0 8px; }
.pc-row .ver { color: #7f849c; margin-right: 10px; }
.pc-row .inst { color: #a6e3a1; margin-left: 10px; }
.pc-status { position: absolute; left: 0; right: 0; top: 450px; text-align: center; color: #a6e3a1; }
.pc-history { left: 6px; top: 498px; width: 470px; height: 110px; padding: 10px 12px; }
.pc-search { left: 492px; top: 498px; width: 930px; height: 110px; padding: 14px 14px; }
.pc-search .prompt { color: #cba6f7; }
.pc-search .caret { display: inline-block; width: 12px; height: 26px; background: #cdd6f4; vertical-align: -5px; margin-left: 2px; }
.pc-install { left: 1438px; top: 498px; width: 476px; height: 110px; padding: 10px 14px; }
.pc-install .item { color: #cdd6f4; }
.pc-install .item::before { content: '+ '; color: #a6e3a1; }
.pc-info { left: 6px; top: 630px; right: 6px; height: 330px; padding: 12px 14px; }
.pc-info > div[id^='info-'] { position: absolute; left: 14px; right: 14px; top: 14px; }
.pc .fit { width: fit-content; }
.pc-info .k { color: #74c7ec; }
.pc-info a { color: #cba6f7; text-decoration: underline; }
.pc-foot { position: absolute; left: 14px; right: 14px; top: 978px; color: #a6adc8; font-size: 18px; line-height: 30px; }
.pc-foot kbd { font: inherit; color: #1e1e2e; background: #6c7086; padding: 0 4px; margin-right: 6px; }
.pc-modal { position: absolute; background: #1e1e2e; border: 2px solid #b4befe; padding: 26px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.pc-modal > .title { position: absolute; top: -17px; left: 18px; background: #1e1e2e; padding: 0 6px; color: #b4befe; font-weight: 700; }
.pc-preflight { left: 470px; top: 230px; width: 980px; height: 560px; }
.pc-updmodal { left: 420px; top: 170px; width: 1080px; height: 600px; }
.pc-done { position: absolute; left: 520px; top: 690px; width: 880px; padding: 10px 16px; color: #a6e3a1; border: 1px solid #a6e3a1; background: #1e2a24; }
.pc-bar { display: inline-block; width: 300px; height: 14px; background: #313244; vertical-align: 1px; margin-left: 10px; }
.pc-bar i { display: block; height: 100%; width: 100%; background: #a6e3a1; }
</style>
