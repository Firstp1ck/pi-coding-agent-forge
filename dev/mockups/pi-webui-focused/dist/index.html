function renderTranscript(){const s=sessions.find(x=>x.id===activeSession);$('session-title').textContent=s?.name||'Previous session';let content='';if(activeSession==='design')content=message('You','Make the workspace more compact. Keep every feature reachable, but let the conversation breathe.')+message('Pi',`<details class="tool-log"><summary><span class="check">✓</span> Inspected 12 sections · 3 files updated <span class="tool-detail">8.4s</span></summary><div class="tool">Read <code>shell-navigation.mjs</code></div><div class="tool">Updated <code>workspace-view.mjs</code></div><div class="tool">Checked responsive layouts</div></details><p>The shell is smaller. Tools now open in one inspector, and configuration lives in Settings.</p><p>Every feature is available in <button class="inline-action" data-action="palette">All tools</button>. Browse by category, search by intent, or pin what you use. The session menu holds actions for this conversation.</p><div class="change-summary"><span style="color:var(--accent)">◇</span><strong>3 files changed</strong><span class="stats">+86 −132</span><button data-action="changes">Review changes →</button></div><p>Project tools stay out of the way until you need them. Approvals stay visible until you respond.</p><div class="message-actions"><button data-action="copy" aria-label="Copy response">⧉</button><button data-feature="feedback" aria-label="Give feedback">♡</button><button data-feature="message-actions" aria-label="Message actions">•••</button><span>GPT-6.1 Sol · 8.4s</span></div>`);else if(activeSession==='tests')content=message('You','Check that switching sessions preserves drafts and does not mix streamed output.')+message('Pi','<p>The session tests use isolated fixtures. Drafts belong to their originating session, while the inspector can open without restarting the connection.</p><div class="tool"><span class="check">✓</span><span class="mono">interaction-continuity</span><span class="tool-detail">12 assertions passed</span></div><p>Try writing a draft, switching sessions, and returning. The mock preserves your text.</p>');else if(activeSession==='review')content=message('You','Review the overhaul plan for migration risks.')+message('Pi','<p>The review is ready. One request needs your decision before the demo proceeds.</p><div class="summary-card"><span style="color:var(--warning)">◉</span><div><strong>Approval requested</strong><p>Inspect the proposed migration fixture.</p></div><button data-action="approval">Review ↗</button></div>');else content=message('Pi','<p>This is a new demo session. Write a prompt below to try the composer.</p>');$('transcript').innerHTML='<div class="day">TODAY · LOCAL WORKSPACE</div>'+content+(extraMessages.get(activeSession)||[]).join('');}
function switchSession(id){drafts.set(activeSession,$('prompt').value);activeSession=id;$('prompt').value=drafts.get(id)||'';$('sidebar').classList.remove('open');showChat();renderSessions();renderTranscript()}

ata-action="runner-start">＋ Run a task</button>';else if(panelTab==='Agents')html='<div class="eyebrow">This workspace</div><div class="agent-card"><div class="agent-heading"><span class="dot green"></span><strong>Session continuity</strong><small>SOL</small></div><p>Checking drafts and reconnect behavior</p><div class="tiny muted">12 checks complete · 2m 14s</div></div>'+approvalCard()+'<div class="notice">Closing this inspector keeps agent work running. Pending requests remain visible beside the composer.</div>';else if(panelTab==='Queue')html='<h3>Follow-up queue</h3><div class="agent-card"><strong>1 · Next after this response</strong><p>Check the tablet layout and keyboard navigation.</p><button data-action="queue-remove">Remove demo item</button></div><p class="tiny muted">Queued prompts belong to the selected session.</p>';else if(panelTab==='Events')html='<h3>Recent events</h3><div class="metric"><span>✓ Session connected</span><span>14:32</span></div><div class="metric"><span>✓ Draft restored</span><span>14:34</span></div><div class="metric"><span>◉ Review requested</span><span>14:35</span></div>';else html='<h3>Conversation context</h3><div class="metric"><span>Context used</span><strong>29% · 79k / 272k</strong></div><div class="progress"><span></span></div><div class="metric"><span>Auto compaction</span><button class="switch" aria-label="Auto compaction" aria-pressed="true" data-toggle></button></div><div class="metric"><span>Current model</span><span>GPT-6.1 Sol</span></div><div class="metric"><span>Thinking effort</span><span>High</span></div><button data-action="compact" style="margin-top:20px">Compact now</button><p class="tiny muted">Changes apply to this session only.</p>';$('panel-content').innerHTML=html;}

let toolCategory='Suggested';
const pinnedTools=new Set(['changes','queue']);
function renderPinnedTools(){
  $('pinned-tools').innerHTML=[...pinnedTools].map(id=>{const tool=toolCatalog.find(t=>t.id===id);return `<button class="pin-shortcut" ${tool.action?`data-action="${tool.action}"`:`data-feature="${tool.id}"`}><span>◇</span><span>${tool.name}</span></button>`}).join('')||'<p class="tiny muted" style="padding:0 6px">Pin a tool from All tools.</p>';

function togglePin(id){
  if(pinnedTools.has(id))pinnedTools.delete(id);else pinnedTools.add(id);
  renderPinnedTools();renderPalette($('palette-search').value);
  $('palette-list').querySelector(`[data-pin="${id}"]`)?.focus();
}
function openTools(category='Suggested'){
  $('sidebar').classList.remove('open');
  toolCategory=category;$('palette-search').value='';renderPalette();
  if(!$('palette').open)$('palette').showModal();
  syncPaletteRun();$('palette-search').focus();
}
function renderPalette(query=''){

  $('palette-categories').innerHTML=categories.map(c=>`<button data-tool-category="${c}" aria-pressed="${c===toolCategory}">${c}</button>`).join('');
  const search=query.trim().toLowerCase();
  let results=toolCatalog.filter(t=>search?`${t.name} ${t.hint} ${t.category} ${(t.options||[]).join(' ')}`.toLowerCase().includes(search):toolCategory==='All tools'||toolCategory==='Suggested'||t.category===toolCategory);
  if(!search&&toolCategory==='Suggested')results=results.slice(0,8);
  $('palette-section').textContent=search?`${results.length} results across all tools`:toolCategory==='Suggested'?'Suggested for this session':`${toolCategory} · ${results.length}`;
  $('palette-list').innerHTML=results.map(t=>`<div class="command-row"><button class="command" ${t.action?`data-action="${t.action}"`:`data-feature="${t.id}"`}><span>${escapeHtml(t.name)}</span><small>${escapeHtml(t.hint)}</small></button><button class="pin-action" data-pin="${t.id}" aria-pressed="${pinnedTools.has(t.id)}" aria-label="${pinnedTools.has(t.id)?'Unpin':'Pin'} ${escapeHtml(t.name)}">${pinnedTools.has(t.id)?'★':'☆'}</button></div>`).join('')||'<p class="muted tiny" style="padding:0 9px">No matching tools. Try “Git”, “voice”, or “theme”.</p>';
}
function openFeature(id){
  const tool=toolCatalog.find(t=>t.id===id);if(!tool)return;
  $('sidebar').classList.remove('open');showChat();setCurrent(tool.category==='Project'?'project':tool.category==='Activity'?'activity':tool.category==='Settings'?'settings':'chat');panel='Tool';$('inspector').hidden=false;$('inspector-title').textContent=tool.name;$('panel-tabs').innerHTML='';
  $('panel-content').innerHTML=`<div class="file-path">${tool.category} / ${escapeHtml(tool.name)}</div><h3>${escapeHtml(tool.name)}</h3><p class="tiny muted">${escapeHtml(tool.hint)}</p><span class="scope">${tool.scope||'Current session · '+escapeHtml(sessions.find(s=>s.id===activeSession)?.name||'Demo session')}</span><div class="feature-options">${(tool.options||[]).map(choice=>`<button data-choice="true" aria-pressed="false">${escapeHtml(choice)}</button>`).join('')}</div><button class="tiny" data-action="palette">Browse all tools</button><div class="notice">Interaction preview. These choices demonstrate where the feature lives; they do not execute commands or change your installation.</div>`;
}
$('palette').addEventListener('keydown',event=>{
  const results=[...$('palette-list').querySelectorAll('.command')];
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){
    event.preventDefault();if(!results.length)return;
    const index=results.indexOf(document.activeElement),step=event.key==='ArrowDown'?1:-1;
    results[index<0?(step>0?0:results.length-1):(index+step+results.length)%results.length].focus();
  }else if(event.key==='Enter'&&event.target===$('palette-search')){event.preventDefault();results[0]?.click()}
});
function resolveApproval(allow){approved=true;$('attention').hidden=true;$('activity-count').textContent='0';$('activity-dot').hidden=true;renderPanel();toast(allow?'Demo request allowed. No command was executed.':'Demo request declined.')}
function sendPrompt(){const text=$('prompt').value.trim();if(!text){$('prompt').focus();return}if(runTimer){toast('A demo response is already running.');return}const target=activeSession;const messages=extraMessages.get(target)||[];messages.push(message('You',escapeHtml(text)));extraMessages.set(target,messages);$('prompt').value='';drafts.set(target,'');attachmentNames=[];$('attachment-label').hidden=true;renderTranscript();$('global-run').hidden=false;$('send').disabled=true;$('run-label').textContent='Demo response · '+$('session-title').textContent;runTimer=setTimeout(()=>{messages.push(message('Pi','<p>This mock keeps the conversation central while other tools open on demand. Try <strong>Project</strong>, <strong>Activity</strong>, or <strong>Settings</strong> to explore the layout.</p><p class="muted">Simulated response. No model or server is connected.</p>'));if(activeSession===target)renderTranscript();finishRun();},1600);syncPaletteRun();$('transcript').scrollTop=$('transcript').scrollHeight}
function syncPaletteRun(){$('palette-run').hidden=!runTimer;$('palette-run-label').textContent=$('run-label').textContent}
function finishRun(){clearTimeout(runTimer);runTimer=null;$('global-run').hidden=true;$('send').disabled=false;syncPaletteRun()}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.dataset.toolCategory){toolCategory=el.dataset.toolCategory;$('palette-search').value='';renderPalette();return}if(el.dataset.pin){togglePin(el.dataset.pin);return}if(el.dataset.feature){$('palette').close();openFeature(el.dataset.feature);return}if(el.dataset.choice){el.parentElement.querySelectorAll('button').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});el.classList.add('selected');el.setAttribute('aria-pressed','true');toast('Demo selection: '+el.textContent);return}if(el.dataset.session){switchSession(el.dataset.session);return}if(el.dataset.tab){panelTab=el.dataset.tab;renderPanel();return}if(el.dataset.category){settingsCategory=el.dataset.category;openSettings();return}if(el.hasAttribute('data-toggle')){el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true');return}if(el.dataset.file){$('panel-content').innerHTML=`<button class="back-button" data-action="project">← Files</button><div class="file-path mono">${escapeHtml(el.dataset.file)}</div><pre>export function openWorkspace(view) {\n  preserveDraft(activeSession);\n  inspector.open(view);\n}\n\n// Illustrative prototype content</pre><p class="tiny muted">Read-only sample · file access is simulated</p>`;return}const action=el.dataset.action;if(!action)return;if(action!=='palette'&&$('palette').open)$('palette').close();switch(action){case'chat':showChat();panel=null;renderPanel();$('sidebar').classList.remove('open');break;case'sessions':if(matchMedia('(max-width:600px)').matches)$('sidebar').classList.toggle('open');else $('app').classList.toggle('sidebar-collapsed');break;case'project':openPanel('Project');break;case'changes':openPanel('Project','Changes');break;case'run':openPanel('Project','Run');break;case'activity':case'approval':openPanel('Activity');break;case'details':openPanel('Session details');break;case'close-panel':panel=null;renderPanel();break;case'settings':openSettings();break;case'palette':openTools();break;case'session-menu':openTools('Sessions');break;case'composer-menu':openTools('Compose');break;case'queue':openPanel('Activity','Queue');break;case'close-palette':$('palette').close();break;case'new':{const id='new-'+Date.now();sessions.push({id,name:'New demo session',state:'Idle',time:'just now',color:'green'});switchSession(id);$('prompt').focus();break}case'attach':$('file-input').click();break;case'approve':resolveApproval(true);break;case'decline':resolveApproval(false);break;case'abort':finishRun();toast('Demo response stopped.');break;case'queue-remove':el.closest('.agent-card').remove();toast('Demo queue item removed.');break;case'runner':el.closest('.agent-card').querySelector('pre').textContent='Demo runner stopped.';el.disabled=true;break;case'copy':navigator.clipboard?.writeText('Focused workspace: Conversation, Sessions, Project, Activity and Settings.').then(()=>toast('Summary copied.')).catch(()=>toast('Copy is unavailable in this preview.'));break;default:toast({feedback:'Feedback recorded for this preview.',compact:'Demo compaction complete. No session data changed.',setup:'Setup preview only. No settings were applied.', 'review-demo':'Illustrative review complete. No Git action was performed.','runner-start':'Demo task selected. No process was started.'}[action]||'Demo action selected.')}});
document.addEventListener('input',event=>{if(event.target.id==='settings-search')renderSettings(event.target.value);if(event.target.id==='palette-search')renderPalette(event.target.value)});
document.addEventListener('change',event=>{if(event.target.id==='theme-select')$('app').classList.toggle('light',event.target.value==='light');if(event.target.id==='file-input'){attachmentNames=Array.from(event.target.files,f=>f.name);$('attachment-label').textContent=attachmentNames.join(' · ');$('attachment-label').hidden=!attachmentNames.length;toast('Files are listed locally; nothing is uploaded.')}});
$('prompt-form').addEventListener('submit',event=>{event.preventDefault();sendPrompt()});$('prompt').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendPrompt()}});document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();openTools()}if(event.key==='Escape'&&!$('palette').open){panel=null;renderPanel();$('sidebar').classList.remove('open')}});renderSessions();renderTranscript();renderPinnedTools();
</script></body></html>
